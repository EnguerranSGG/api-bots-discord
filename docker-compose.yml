version: '3.8'

services:
  app-dev:
    container_name: api-bots-discord-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes: 
      - .:/app
      - /app/node_modules
    depends_on:
      - db
    profiles:
      - dev    

  app-prod:
    container_name: api-bots-discord-prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    expose:
      - "9015"
    environment:
      - PORT=9015
    depends_on:
      - db-prod
    networks:
      - app-network
    profiles:
      - prod

  nginx:
    image: nginx:alpine
    container_name: api-bots-discord-nginx
    ports:
      - "9015:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-prod
    networks:
      - app-network
    profiles:
      - prod

  db:
    image: postgres:17-alpine
    container_name: api-bots-discord-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    networks:
      - app-network
    profiles:
      - dev

  db-prod:
    image: postgres:17-alpine
    container_name: api-bots-discord-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    networks:
      - app-network
    profiles:
      - prod

  pgadmin:
    image: dpage/pgadmin4
    container_name: api-bots-discord-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@example.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app-network

volumes:
  pgdata-dev:
  pgdata-prod:

networks:
  app-network:
    driver: bridge
